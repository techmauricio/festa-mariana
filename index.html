<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirme sua presença</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#FDF2E4;
    --card:#FFFDFB;
    --ink:#4A2F35;
    --pink:#F5A3C0;
    --pink-deep:#EF7FA8;
    --gold:#E3B36B;
    --aqua:#4FB8B4;
    --sunset:#F28C4B;
    --line: rgba(74,47,53,0.14);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg, #FDF2E4 0%, #FBE7D3 55%, #F7DEC9 100%);
    background-image:
      radial-gradient(circle at 8% 10%, rgba(245,163,192,0.16) 0, transparent 30%),
      radial-gradient(circle at 92% 88%, rgba(242,140,75,0.14) 0, transparent 30%);
  }

  .wrap{ width:100%; max-width:500px; }

  .sparkle-row{
    text-align:center;
    font-size:20px;
    letter-spacing:14px;
    margin-bottom:6px;
    opacity:.85;
  }

  .eyebrow{
    text-align:center;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:22px;
    color:var(--pink-deep);
    margin-bottom:2px;
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    text-align:center;
    font-size:clamp(30px, 7.5vw, 44px);
    line-height:1.08;
    margin:0 0 10px;
    color:var(--ink);
  }
  h1 span{ color:var(--pink-deep); }

  .subtitle{
    text-align:center;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    opacity:.75;
    margin:0 0 22px;
  }

  .details{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .details div{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:700;
    background:#fff;
    padding:8px 14px;
    border-radius:999px;
    box-shadow:0 4px 14px -6px rgba(91,58,75,0.18);
  }

  /* Card */
  .card{
    position:relative;
    background:var(--card);
    border-radius:28px;
    box-shadow: 0 20px 46px -16px rgba(91,58,75,0.28);
    overflow:hidden;
    border:1px solid rgba(227,179,107,0.35);
  }

  .ribbon{
    position:absolute;
    top:16px; left:50%;
    transform:translateX(-50%);
    font-size:26px;
  }

  .card-top{
    padding:44px 30px 18px;
    text-align:center;
  }
  .card-top h2{
    font-family:'Fredoka', sans-serif;
    font-size:22px;
    margin:0 0 4px;
    color:var(--pink-deep);
  }
  .card-top p{
    margin:0;
    font-size:13.5px;
    opacity:.7;
    font-weight:600;
  }

  .scallop{
    height:14px;
    background:
      radial-gradient(circle at 10px 0, transparent 12px, var(--card) 13px) top left / 20px 14px repeat-x;
    margin-top:6px;
  }

  form{ padding:22px 28px 30px; display:flex; flex-direction:column; gap:16px; }

  label{
    font-size:12.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--pink-deep);
    margin-bottom:6px;
    display:block;
  }

  input[type="text"], input[type="tel"], textarea{
    width:100%;
    font-family:'Quicksand', sans-serif;
    font-size:15px;
    font-weight:600;
    padding:12px 14px;
    border-radius:14px;
    border:2px solid var(--line);
    background:var(--blush);
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input::placeholder, textarea::placeholder{ color:rgba(91,58,75,0.4); font-weight:500; }
  input:focus, textarea:focus{
    border-color:var(--pink-deep);
    background:#fff;
  }
  textarea{ resize:vertical; min-height:70px; }

  .choice-group{ display:flex; gap:10px; }
  .choice{ flex:1; position:relative; }
  .choice input{ position:absolute; opacity:0; inset:0; cursor:pointer; }
  .choice label{
    margin:0;
    text-align:center;
    padding:12px 10px;
    border-radius:14px;
    border:2px solid var(--line);
    background:var(--blush);
    font-size:14px;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
    color:var(--ink);
    cursor:pointer;
    transition:.15s ease;
  }
  .choice input:checked + label{
    background:linear-gradient(135deg, var(--pink-deep), var(--aqua));
    border-color:var(--pink-deep);
    color:#fff;
    box-shadow:0 8px 16px -8px rgba(239,127,168,0.6);
  }

  button{
    margin-top:6px;
    font-family:'Fredoka', sans-serif;
    font-size:17px;
    font-weight:600;
    letter-spacing:.02em;
    color:#fff;
    background:linear-gradient(135deg, var(--pink-deep), var(--sunset));
    border:none;
    border-radius:16px;
    padding:14px 20px;
    cursor:pointer;
    box-shadow:0 12px 22px -10px rgba(239,127,168,0.65);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover{ transform:translateY(-2px); }
  button:disabled{ opacity:.6; cursor:default; transform:none; }

  .status{
    text-align:center;
    font-weight:700;
    font-size:13.5px;
    min-height:18px;
  }
  .status.err{ color:#C0392B; }

  .success-screen{
    display:none;
    padding:46px 28px;
    text-align:center;
  }
  .success-screen.show{ display:block; }
  .success-screen .emoji{ font-size:42px; margin-bottom:10px; }
  .success-screen h2{
    font-family:'Fredoka', sans-serif;
    font-size:23px;
    margin:0 0 8px;
    color:var(--pink-deep);
  }
  .success-screen p{ margin:0; opacity:.75; font-weight:600; font-size:14px; }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise .5s ease both; }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="sparkle-row">🏐 ✦ 🎀 ✦ 🏐</div>
  <div class="eyebrow">você está convidada para os</div>
  <h1>15 anos da<br><span>Mariana</span></h1>
  <p class="subtitle">Aguardo você nessa comemoração, no clima de praia ☀️🏐</p>

  <div class="details">
    <div>🗓️ [DIA/MÊS], [HORÁRIO]</div>
    <div>📍 Choperia do Lugui - Av. Onze de Agosto, 306</div>
  </div>

  <div class="card">
    <div class="ribbon" id="cardRibbon">🎀🏐</div>
    <div class="card-top" id="cardTop">
      <h2>Confirme sua presença</h2>
    </div>
    <div class="scallop" id="cardScallop"></div>

    <form id="rsvpForm">
      <div>
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" name="nome" placeholder="Nome e sobrenome" required>
      </div>

      <div>
        <label>Você vai?</label>
        <div class="choice-group">
          <div class="choice">
            <input type="radio" id="vai_sim" name="presenca" value="Vouuu! 🎉" checked>
            <label for="vai_sim">Vouuu! 🎉</label>
          </div>
          <div class="choice">
            <input type="radio" id="vai_nao" name="presenca" value="Não vou conseguir">
            <label for="vai_nao">Não vou conseguir</label>
          </div>
        </div>
      </div>

      <div>
        <label for="telefone">WhatsApp (opcional)</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
      </div>

      <div>
        <label for="recado">Deixe um recado (opcional)</label>
        <textarea id="recado" name="recado" placeholder="Um recadinho carinhoso pra ela ♥"></textarea>
      </div>

      <button type="submit" id="submitBtn">Enviar confirmação</button>
      <p class="status" id="statusMsg"></p>
    </form>

    <div class="success-screen" id="successScreen">
      <div class="emoji">💕</div>
      <h2>Confirmado!</h2>
      <p>Obrigada por confirmar. Espero você na festa!</p>
    </div>
  </div>

</div>

<script>
  // Cole aqui a URL do seu Web App do Google Apps Script (termina em /exec)
  const FORM_ENDPOINT = "https://script.google.com/macros/s/AKfycbzCwPdcL-TYr6pD497QbTRYcIegeOpj6V5D1FKipax6DidoEsdMC4WJylulHNR83cHi/exec";

  const form = document.getElementById('rsvpForm');
  const cardTop = document.getElementById('cardTop');
  const cardScallop = document.getElementById('cardScallop');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');
  const successScreen = document.getElementById('successScreen');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.textContent = '';
    statusMsg.className = 'status';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    try {
      // mode: 'no-cors' é necessário para o Apps Script.
      // O navegador bloqueia a leitura da resposta, então tratamos
      // qualquer envio sem erro de rede como sucesso.
      await fetch(FORM_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        body: new FormData(form)
      });

      form.style.display = 'none';
      cardTop.style.display = 'none';
      cardScallop.style.display = 'none';
      successScreen.classList.add('show');
    } catch (err) {
      statusMsg.textContent = 'Nao enviado. Tente de novo em instantes.';
      statusMsg.className = 'status err';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar confirmação';
    }
  });
</script>
</body>
</html>
